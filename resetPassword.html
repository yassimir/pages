
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Réinitialiser le mot de passe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        .reset-icon {
            font-size: 42px;
            color: #0d6efd;
            margin-bottom: 15px;
        }

        .btn-reset {
            width: 100%;
            padding: 11px;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <div class="text-center mb-4">
        <i class="fa fa-key reset-icon"></i>
        <h4>Nouveau mot de passe</h4>
    </div>

    <div th:if="${erreur}"
         class="alert alert-danger"
         role="alert"
         th:text="${erreur}">
    </div>

    <div th:if="${tokenValide}">

        <p class="text-muted">
            Choisissez votre nouveau mot de passe.
        </p>

        <form th:action="@{/reset-password}" method="post">

            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="nouveauMotDePasse">Nouveau mot de passe</label>

                <input type="password"
                       id="nouveauMotDePasse"
                       name="nouveauMotDePasse"
                       class="form-control"
                       minlength="8"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="form-group">
                <label for="confirmationMotDePasse">
                    Confirmer le mot de passe
                </label>

                <input type="password"
                       id="confirmationMotDePasse"
                       name="confirmationMotDePasse"
                       class="form-control"
                       minlength="8"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary btn-reset">
                Réinitialiser le mot de passe
            </button>

        </form>

    </div>

    <div th:unless="${tokenValide}" class="text-center">

        <p class="text-danger">
            Ce lien est invalide, expiré ou déjà utilisé.
        </p>

        <a th:href="@{/forgot-password}" class="btn btn-primary">
            Demander un nouveau lien
        </a>

    </div>

</div>

</body>
</html>
